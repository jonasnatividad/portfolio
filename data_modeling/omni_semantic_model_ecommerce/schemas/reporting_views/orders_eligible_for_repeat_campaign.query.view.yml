# Derived view: which customers should get a "come back and shop again" email.
#
# Business rule (one row per eligible customer):
#   1. The customer's most recent order is Complete (delivered, not returned).
#   2. That order was delivered between 30 and 90 days ago - long enough that
#      they are not still unpacking, recent enough that they remember the store.
#   3. The customer has no open order (Processing or Shipped).
#   4. The customer has never returned more than half of their orders.
#
# Keeping the rule in one SQL view means every dashboard, export and alert uses
# the same definition, and the window is changed in one place.
label: Repeat Campaign Eligibility
description: Customers eligible for the repeat-purchase campaign, with the facts behind the decision.

sql: |
  WITH order_history AS (
    SELECT
      user_id,
      order_id,
      status,
      created_at,
      delivered_at,
      ROW_NUMBER() OVER (PARTITION BY user_id ORDER BY created_at DESC, order_id DESC) AS recency_rank
    FROM `bigquery-public-data.thelook_ecommerce.orders`
  ),
  customer_rollup AS (
    SELECT
      user_id,
      COUNT(*) AS lifetime_orders,
      COUNTIF(status = 'Returned') AS lifetime_returns,
      COUNTIF(status IN ('Processing', 'Shipped')) AS open_orders
    FROM order_history
    GROUP BY user_id
  ),
  last_order AS (
    SELECT user_id, order_id, status, created_at, delivered_at
    FROM order_history
    WHERE recency_rank = 1
  ),
  last_order_value AS (
    SELECT order_id, SUM(sale_price) AS order_value
    FROM `bigquery-public-data.thelook_ecommerce.order_items`
    WHERE order_id IN (SELECT order_id FROM last_order)
    GROUP BY order_id
  )
  SELECT
    l.user_id,
    l.order_id AS last_order_id,
    l.created_at AS last_ordered_at,
    l.delivered_at AS last_delivered_at,
    DATE_DIFF(CURRENT_DATE(), DATE(l.delivered_at), DAY) AS days_since_delivery,
    v.order_value AS last_order_value,
    r.lifetime_orders,
    r.lifetime_returns
  FROM last_order AS l
  JOIN customer_rollup AS r USING (user_id)
  LEFT JOIN last_order_value AS v ON v.order_id = l.order_id
  WHERE l.status = 'Complete'
    AND l.delivered_at IS NOT NULL
    AND DATE(l.delivered_at) BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 90 DAY)
                                 AND DATE_SUB(CURRENT_DATE(), INTERVAL 30 DAY)
    AND r.open_orders = 0
    AND SAFE_DIVIDE(r.lifetime_returns, r.lifetime_orders) <= 0.5

dimensions:
  user_id:
    sql: '"user_id"'
    type: number
    primary_key: true
    hidden: true

  last_order_id:
    sql: '"last_order_id"'
    type: number
    label: Last Order ID

  last_ordered_at:
    sql: '"last_ordered_at"'
    type: timestamp
    label: Last Ordered
    timeframes: [raw, date, week, month]

  last_delivered_at:
    sql: '"last_delivered_at"'
    type: timestamp
    label: Last Delivered
    timeframes: [raw, date, week, month]

  days_since_delivery:
    sql: '"days_since_delivery"'
    type: number
    label: Days Since Delivery

  send_wave:
    sql: |
      CASE
        WHEN ${orders_eligible_for_repeat_campaign.days_since_delivery} <= 45 THEN 'Wave 1 (30-45 days)'
        WHEN ${orders_eligible_for_repeat_campaign.days_since_delivery} <= 60 THEN 'Wave 2 (46-60 days)'
        ELSE 'Wave 3 (61-90 days)'
      END
    type: string
    label: Send Wave
    description: Splits the audience so the email can go out in three timed waves.

  last_order_value:
    sql: '"last_order_value"'
    type: number
    format: usdcurrency
    label: Last Order Value

  lifetime_orders:
    sql: '"lifetime_orders"'
    type: number
    label: Lifetime Orders

  lifetime_returns:
    sql: '"lifetime_returns"'
    type: number
    label: Lifetime Returns

  is_repeat_buyer:
    sql: ${orders_eligible_for_repeat_campaign.lifetime_orders} > 1
    type: yesno
    label: Is Repeat Buyer

measures:
  eligible_customer_count:
    aggregate_type: count
    label: Eligible Customers

  average_last_order_value:
    sql: ${orders_eligible_for_repeat_campaign.last_order_value}
    aggregate_type: average
    format: usdcurrency
    label: Avg Last Order Value
