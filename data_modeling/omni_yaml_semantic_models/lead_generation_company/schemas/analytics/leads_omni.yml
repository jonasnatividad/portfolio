# Reference this view as leads_omni
schema: analytics
table_name: lead_flat

dimensions:
  ##############################
  # IDs #
  ##############################

  lead_id:
    format: ID
    description: Unique identifier for record.
    group_label: IDs
    primary_key: true

  lead_client_id:
    format: ID
    description: Unique sub-identifier for record.
    group_label: IDs

  affiliate_id:
    format: ID
    description: Unique affiliate identifier for record.
    group_label: IDs
    hidden: true

  campaign_id:
    format: ID
    description: Unique campaign identifier for record.
    group_label: IDs
    hidden: true

  contract_id:
    format: ID
    description: Unique contract identifier for record.
    group_label: IDs
    hidden: true

  ##############################
  # Key Metrics #
  ##############################

  status:
    sql: CASE WHEN status = 'Return' THEN 'Returned' WHEN status = 'Delivered' THEN
      'Billable' ELSE status END
    description: Status of the record grouped into limited categories.
    group_label: Key Metrics

  client_status:
    sql: CASE WHEN client_status = 'Return' then 'Returned' ELSE
      INITCAP(client_status) END
    description: Client status of the record grouped into limited categories.
    group_label: Key Metrics

  match_type:
    description: Type of match from the lead to the intake center status.
    group_label: Key Metrics

  email_drop:
    description: Indicator on email performance.
    group_label: Key Metrics

  tier:
    sql: ${analytics__contract.tier}
    group_label: Key Metrics

  description:
    description: Description submitted by the claimant.
    group_label: Key Metrics

  last_action:
    sql: INITCAP(last_action)
    description: Last action performed.
    group_label: Key Metrics

  last_action_notes:
    description: Notes on last action performed.
    group_label: Key Metrics

  turn_down_reason:
    label: Turned Down Reason
    description: Reason for being turned down.
    group_label: Key Metrics

  ##############################
  # Key Filters #
  ##############################

  lead_type:
    description: Lead type.
    group_label: Key Filters

  lead_payment_type:
    sql: ${analytics__campaigns.lead_payment_type}
    description: Lead payment type.
    group_label: Key Filters

  campaign_type:
    sql: ${analytics__campaigns.campaign_type}
    description: Campaign type.
    group_label: Key Filters

  account_manager:
    sql: ${analytics__affiliates.account_manager}
    group_label: Key Filters

  client_owner:
    sql: ${analytics__deals.owner_name}
    label: Client Owner
    group_label: Key Filters

  client_manager:
    sql: ${analytics__deals.manager}
    label: Client Manager
    group_label: Key Filters

  anura_response:
    sql: CASE WHEN campaign LIKE '%H&P%' THEN '⚪ H&P' ELSE anura_response END
    description: Response from Anura.
    group_label: Key Filters

  description_value:
    sql: CASE WHEN ${leads_omni.description} IS NULL OR ${leads_omni.description} =
      '' THEN 'Blank' ELSE 'Filled-In' END
    description: Description submitted by the claimant (filled-in or blank).
    group_label: Key Filters

  ##############################
  # Key Boolean Filters #
  ##############################

  is_paid_lead_flag:
    sql: ${leads_omni.is_lead} = 1 AND ${leads_omni.marketing_cost} > 0
    label: Is Paid Lead
    description: Is the record a paid lead?
    group_label: Key Boolean Filters

  is_deal_active_flag:
    sql: ${analytics__deals.is_deal_active_flag}
    label: Is Deal Active
    description: Is the deal active?
    group_label: Key Boolean Filters

  is_cherry_picked_lead_flag:
    sql: ${leads_omni.cherry_picked} = 1
    label: Is Cherry Picked Lead
    description: Is the record a cherry picked lead?
    group_label: Key Boolean Filters

  is_smart_review_eligible_lead_flag:
    sql: CASE WHEN
      ${reporting_views__smart_reviews_deals_eligible.is_smart_review_eligible}
      IS TRUE AND COALESCE(${leads_omni.is_test}, 0) = 0 AND
      ${leads_omni.is_delivered} = 1 THEN TRUE ELSE FALSE END
    label: Is Smart Review Eligible Lead
    description: Is the record a smart review eligible lead?
    group_label: Key Boolean Filters

  has_smart_review_value__flag:
    sql: ${base__smart_reviews.lead_client_id} IS NOT NULL
    label: Has Smart Review Value
    description: Does the record have a smart review value?
    group_label: Key Boolean Filters

  ##############################
  # PII #
  ##############################

  first_name:
    description: Retainer's first name.
    group_label: PII

  last_name:
    description: Retainer's last name.
    group_label: PII

  phone:
    description: Retainer's phone number.
    group_label: PII

  email:
    description: Retainer's email address.
    group_label: PII

  ##############################
  # Record-Level Costs #
  ##############################

  referral_fee_cost:
    format: usdcurrency
    description: Total spend on all referral fees.
    group_label: Record-Level Costs

  marketing_cost:
    format: usdcurrency
    description: Total spend on marketing related expenses.
    group_label: Record-Level Costs

  intake_cost:
    format: usdcurrency
    description: Total spend on intake related expenses.
    group_label: Record-Level Costs

  total_cost:
    format: usdcurrency
    description: Total spend on all expenses.
    group_label: Record-Level Costs

  cost_lead:
    sql: ${analytics__lead.cost}
    label: Cost - Lead
    format: usdcurrency
    description: Total spend on all expenses - from `lead` dataset.
    group_label: Record-Level Costs

  ##############################
  # Record-Level Revenue #
  ##############################

  total_revenue:
    format: usdcurrency
    description: Total revenue generated.
    group_label: Record-Level Revenue

  ##############################
  # Pivots #
  ##############################

  affiliate:
    description: Affiliate.
    group_label: Pivots

  campaign:
    description: Campaign.
    group_label: Pivots

  client:
    description: Client.
    group_label: Pivots

  contract:
    description: Contract.
    group_label: Pivots

  lawsuit:
    description: Lawsuit.
    group_label: Pivots

  deal:
    sql: ${analytics__deals.deal_title}
    description: Deal.
    group_label: Pivots

  intake_center:
    sql: ${analytics__contract.call_center}
    description: Intake Center.
    group_label: Pivots

  ##############################
  # Sub-Affiliates #
  ##############################

  s1:
    label: Sub-Affiliate 1 (S1)
    description: Sub-Affiliate 1 (S1)
    group_label: Sub-Affiliates

  s2:
    label: Sub-Affiliate 2 (S2)
    description: Sub-Affiliate 2 (S2)
    group_label: Sub-Affiliates

  s3:
    label: Sub-Affiliate 3 (S3)
    description: Sub-Affiliate 3 (S3)
    group_label: Sub-Affiliates

  s4:
    label: Sub-Affiliate 4 (S4)
    description: Sub-Affiliate 4 (S4)
    group_label: Sub-Affiliates

  s5:
    label: Sub-Affiliate 5 (S5)
    description: Sub-Affiliate 5 (S5)
    group_label: Sub-Affiliates

  ##############################
  # Booleans #
  ##############################

  is_test:
    description: Is the record a test lead?
    hidden: true

  is_lead:
    description: Is the record a real lead?
    hidden: true

  is_distributed_lead_flag:
    sql: ${leads_omni.is_lead} = 1
    hidden: true

  is_pending:
    description: Is the record pending?
    hidden: true

  is_pending_lead_flag:
    sql: ${leads_omni.is_pending} = 1
    hidden: true

  is_pending_correction_lead_flag:
    sql: ${leads_omni.status} = 'Pending Correction'
    hidden: true

  is_failed_te_qa_lead_flag:
    sql: ${leads_omni.status} = 'Failed TE QA'
    hidden: true

  is_jv_lead_flag:
    sql: ${leads_omni.status} = 'JV'
    hidden: true

  is_delivered:
    description: Is the record delivered?
    hidden: true

  is_delivered_lead_flag:
    sql: ${leads_omni.is_delivered} = 1
    hidden: true

  is_signed:
    description: Is the record signed?
    hidden: true

  is_signed_lead_flag:
    sql: ${leads_omni.is_signed} = 1
    hidden: true

  is_signed_in_qa_lead_flag:
    sql: ${leads_omni.is_signed} = 1 AND ${leads_omni.status} <> 'Pending
      Correction'
    hidden: true

  is_returned:
    description: Is the record a lead?
    hidden: true

  is_returned_lead_flag:
    sql: ${leads_omni.is_returned} = 1
    hidden: true

  is_accepted_return_lead_flag:
    sql: ${leads_omni.is_returned} = 1 AND ${leads_omni.is_pending_return} = 0
    hidden: true

  is_pending_return:
    description: Is the record a pending return?
    hidden: true

  is_pending_return_lead_flag:
    sql: ${leads_omni.is_pending_return} = 1
    hidden: true

  is_gross_signed:
    sql: CASE WHEN ${leads_omni.is_signed} = 1 THEN 1 WHEN
      ${leads_omni.is_delivered} = 1 THEN 1 WHEN ${leads_omni.is_pending_return}
      = 1 THEN 1 WHEN ${leads_omni.is_returned} = 1 AND
      ${leads_omni.is_pending_return} = 0 THEN 1 WHEN ${leads_omni.status} IN
      ('Pending Correction', 'Failed TE QA', 'JV') THEN 1 ELSE 0 END
    description: Does the record have an is_returned = 1 (and not pending return),
      or a status of Pending Correction, Failed TE QA, or JV, or is it pending
      return, signed, or delivered?
    hidden: true

  is_gross_signed_lead_flag:
    sql: ${leads_omni.is_gross_signed} = 1
    hidden: true

  is_throttled:
    description: Is the record throttled?
    hidden: true

  is_waterfall:
    description: Is the record waterfalled?
    hidden: true

  is_throttled_lead_flag:
    sql: ${leads_omni.is_throttled} = 1 AND ${leads_omni.is_waterfall} = 0
    hidden: true

  cherry_picked:
    description: Is the record cherry_picked?
    hidden: true

  ##############################
  # Booleans - Anura #
  ##############################

  is_bad_anura_response_lead_flag:
    sql: ${leads_omni.anura_response} = 'bad'
    hidden: true

  ##############################
  # Booleans - Smart Reviews #
  ##############################

  is_smart_review_confirmed_dx_lead_flag:
    sql: CASE WHEN ${leads_omni.is_smart_review_eligible_lead_flag} IS TRUE AND
      ${base__smart_reviews.smart_review_status} = '__CONFIRMED DX' THEN TRUE
      ELSE FALSE END
    hidden: true

  is_smart_review_potentially_viable_lead_flag:
    sql: CASE WHEN ${leads_omni.is_smart_review_eligible_lead_flag} IS TRUE AND
      ${base__smart_reviews.smart_review_status} LIKE '%POTENTIALLY VIABLE%'
      THEN TRUE ELSE FALSE END
    hidden: true

  is_smart_review_release_lead_flag:
    sql: CASE WHEN ${leads_omni.is_smart_review_eligible_lead_flag} IS TRUE AND
      ${base__smart_reviews.smart_review_current_status} = 'RELEASE' THEN TRUE
      ELSE FALSE END
    hidden: true

  is_smart_review_keep_lead_flag:
    sql: CASE WHEN ${leads_omni.is_smart_review_eligible_lead_flag} IS TRUE AND
      ${base__smart_reviews.smart_review_current_status} = 'KEEP' THEN TRUE ELSE
      FALSE END
    hidden: true

  is_smart_review_cnr_lead_flag:
    sql: CASE WHEN ${leads_omni.is_smart_review_eligible_lead_flag} IS TRUE AND
      ${base__smart_reviews.smart_review_current_status} = 'CNR' THEN TRUE ELSE
      FALSE END
    hidden: true

  is_smart_review_empty_or_pending_lead_flag:
    sql: CASE WHEN ${leads_omni.is_smart_review_eligible_lead_flag} IS TRUE AND
      (${base__smart_reviews.smart_review_status} IS NULL OR
      ${base__smart_reviews.smart_review_current_status} = 'PENDING') THEN TRUE
      ELSE FALSE END
    hidden: true

  ##############################
  # Booleans - Description #
  ##############################

  is_blank_description_lead_flag:
    sql: ${leads_omni.description_value} = 'Blank' AND ${leads_omni.marketing_cost}
      > 0 AND ${leads_omni.is_distributed_lead_flag} IS TRUE
    hidden: true

  ##############################
  # Dates #
  ##############################

  created_at:
    label: Lead Created At
    description: Date of creation of the record.
    group_label: Dates
    timeframes:
      [
        raw,
        date,
        week,
        day_of_week_name,
        month,
        quarter,
        year,
        hour,
        time_of_day
      ]

  sold_at:
    description: Date when the lead was distributed.
    group_label: Dates
    timeframes:
      [
        raw,
        date,
        week,
        day_of_week_name,
        month,
        quarter,
        year,
        hour,
        time_of_day
      ]

  signed_at:
    description: Date when the lead signed with intake center.
    group_label: Dates
    timeframes:
      [
        raw,
        date,
        week,
        day_of_week_name,
        month,
        quarter,
        year,
        hour,
        time_of_day
      ]

  delivered_at:
    description: Date when the lead was delivered.
    group_label: Dates
    timeframes:
      [
        raw,
        date,
        week,
        day_of_week_name,
        month,
        quarter,
        year,
        hour,
        time_of_day
      ]

  return_started_at:
    sql: ${base__te_retool_lead_status_update.return_request_date}
    description: Date when the return was started.
    group_label: Dates
    timeframes:
      [
        raw,
        date,
        week,
        day_of_week_name,
        month,
        quarter,
        year,
        hour,
        time_of_day
      ]

  last_action_at:
    sql: TIMESTAMP(last_action_date)
    description: Date when last action was performed.
    group_label: Dates
    timeframes:
      [
        raw,
        date,
        week,
        day_of_week_name,
        month,
        quarter,
        year,
        hour,
        time_of_day
      ]

  last_status_updated_at:
    description: Date when the status was last updated.
    group_label: Dates
    timeframes:
      [
        raw,
        date,
        week,
        day_of_week_name,
        month,
        quarter,
        year,
        hour,
        time_of_day
      ]

  ##############################
  # Dynamic Date #
  ##############################

  dynamic_date_selection:
    sql: CASE WHEN {{# leads_omni.date_type_selector.filter }}'Lead'{{/
      leads_omni.date_type_selector.filter }} THEN
      ${leads_omni.created_at[date]} WHEN {{#
      leads_omni.date_type_selector.filter }}'Sold'{{/
      leads_omni.date_type_selector.filter }} THEN ${leads_omni.sold_at[date]}
      WHEN {{# leads_omni.date_type_selector.filter }}'Signed'{{/
      leads_omni.date_type_selector.filter }} THEN ${leads_omni.signed_at[date]}
      WHEN {{# leads_omni.date_type_selector.filter }}'Delivered'{{/
      leads_omni.date_type_selector.filter }} THEN
      ${leads_omni.delivered_at[date]} WHEN {{#
      leads_omni.date_type_selector.filter }}'Return Started'{{/
      leads_omni.date_type_selector.filter }} THEN
      ${leads_omni.return_started_at[date]} ELSE NULL END
    label: Dynamic Date Selection
    group_label: Dynamic Date
    timeframes: [ date ]

  ##############################
  # Record-Level Durations #
  ##############################

  days_sold_to_signed:
    sql: DATE_DIFF(signed_at, sold_at, day)
    description: Days between sold to signed
    group_label: Record-Level Durations

measures:
  ##############################
  # Total Counts #
  ##############################

  distributed_leads_count:
    sql: ${leads_omni.is_distributed_lead_flag}
    label: Distributed Leads
    group_label: Total Counts
    description: Count of records where is_distributed_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_distributed_lead_flag:
        is: true

  pending_leads_count:
    sql: ${leads_omni.is_pending_lead_flag}
    label: Awaiting E-Sign
    group_label: Total Counts
    description: Count of records where is_pending_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_pending_lead_flag:
        is: true

  pending_return_leads_count:
    sql: ${leads_omni.is_pending_return_lead_flag}
    label: Pending Returns
    group_label: Total Counts
    description: Count of records where is_pending_return_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_pending_return_lead_flag:
        is: true

  returned_leads_count:
    sql: ${leads_omni.is_returned_lead_flag}
    label: Returned Leads
    group_label: Total Counts
    description: Count of records where is_returned_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_returned_lead_flag:
        is: true

  delivered_leads_count:
    sql: ${leads_omni.is_delivered_lead_flag}
    label: Billable
    group_label: Total Counts
    description: Count of records where is_delivered_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_delivered_lead_flag:
        is: true

  pending_correction_leads_count:
    sql: ${leads_omni.is_pending_correction_lead_flag}
