    filters:
      is_pending_correction_lead_flag:
        is: true

  failed_te_qa_leads_count:
    sql: ${leads_omni.is_failed_te_qa_lead_flag}
    label: Failed TE QA
    group_label: Total Counts
    description: Count of records where is_failed_te_qa_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_failed_te_qa_lead_flag:
        is: true

  jv_leads_count:
    sql: ${leads_omni.is_jv_lead_flag}
    label: JV
    group_label: Total Counts
    description: Count of records where is_jv_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_jv_lead_flag:
        is: true

  signed_leads_count:
    sql: ${leads_omni.is_signed_lead_flag}
    label: Signed Leads
    group_label: Total Counts
    description: Count of records where is_signed_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_signed_lead_flag:
        is: true

  signed_in_qa_leads_count:
    sql: ${leads_omni.is_signed_in_qa_lead_flag}
    label: Signed in QA
    group_label: Total Counts
    description: Count of records where is_signed_in_qa_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_signed_in_qa_lead_flag:
        is: true

  paid_leads_count:
    sql: ${leads_omni.is_paid_lead_flag}
    label: Paid Leads
    group_label: Total Counts
    description: Count of records where is_paid_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_paid_lead_flag:
        is: true

  gross_signed_leads_count:
    sql: ${leads_omni.is_gross_signed_lead_flag}
    label: Gross Signed
    group_label: Total Counts
    description: Count of records where is_gross_signed_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_gross_signed_lead_flag:
        is: true

  throttled_leads_count:
    sql: ${leads_omni.is_throttled_lead_flag}
    label: Throttled
    group_label: Total Counts
    description: Count of records where is_throttled_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_throttled_lead_flag:
        is: true

  accepted_returns_count:
    sql: ${leads_omni.is_accepted_return_lead_flag}
    label: Accepted Returns
    group_label: Total Counts
    description: Count of records where is_accepted_return_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_accepted_return_lead_flag:
        is: true

  ##############################
  # Total Counts - Anura #
  ##############################

  bad_anura_response_leads_count:
    sql: ${leads_omni.is_bad_anura_response_lead_flag}
    label: Bad Anura Response Leads
    group_label: Total Counts - Anura
    description: Count of records where is_bad_anura_reponse_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_bad_anura_response_lead_flag:
        is: true

  ##############################
  # Total Counts - Smart Reviews #
  ##############################

  smart_review_eligible_leads_count:
    sql: ${leads_omni.is_smart_review_eligible_lead_flag}
    label: Smart Review Eligible Leads
    group_label: Total Counts - Smart Reviews
    description: Count of records where is_smart_review_eligible_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_smart_review_eligible_lead_flag:
        is: true

  smart_review_confirmed_dx_leads_count:
    sql: ${leads_omni.is_smart_review_confirmed_dx_lead_flag}
    label: SR Confirmed DX Leads
    group_label: Total Counts - Smart Reviews
    description: Count of records where is_smart_review_confirmed_dx_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_smart_review_confirmed_dx_lead_flag:
        is: true

  smart_review_potentially_viable_leads_count:
    sql: ${leads_omni.is_smart_review_potentially_viable_lead_flag}
    label: SR Potentially Viable Leads
    group_label: Total Counts - Smart Reviews
    description: Count of records where is_smart_review_potentially_viable_lead_flag
      is TRUE.
    aggregate_type: count
    filters:
      is_smart_review_potentially_viable_lead_flag:
        is: true

  smart_review_release_leads_count:
    sql: ${leads_omni.is_smart_review_release_lead_flag}
    label: SR Release Leads
    group_label: Total Counts - Smart Reviews
    description: Count of records where is_smart_review_release_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_smart_review_release_lead_flag:
        is: true

  smart_review_keep_leads_count:
    sql: ${leads_omni.is_smart_review_keep_lead_flag}
    label: SR Keep Leads
    group_label: Total Counts - Smart Reviews
    description: Count of records where is_smart_review_keep_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_smart_review_keep_lead_flag:
        is: true

  smart_review_cnr_leads_count:
    sql: ${leads_omni.is_smart_review_cnr_lead_flag}
    label: SR CNR Leads
    group_label: Total Counts - Smart Reviews
    description: Count of records where is_smart_review_cnr_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_smart_review_cnr_lead_flag:
        is: true

  smart_review_empty_or_pending_leads_count:
    sql: ${leads_omni.is_smart_review_empty_or_pending_lead_flag}
    label: SR Empty or Pending Leads
    group_label: Total Counts - Smart Reviews
    description: Count of records where is_smart_review_empty_or_pending_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_smart_review_empty_or_pending_lead_flag:
        is: true

  ##############################
  # Total Counts - Description #
  ##############################

  blank_description_leads_count:
    sql: ${leads_omni.is_blank_description_lead_flag}
    label: Blank Description Leads
    group_label: Total Counts - Description
    description: Count of records where is_blank_description_lead_flag is TRUE.
    aggregate_type: count
    filters:
      is_blank_description_lead_flag:
        is: true

  ##############################
  # Total Costs #
  ##############################

  total_referral_fee_cost:
    sql: ${leads_omni.referral_fee_cost}
    label: Total Referral Fee Cost
    group_label: Total Costs
    format: usdcurrency
    description: Sum of total referral fees.
    aggregate_type: sum

  total_marketing_cost:
    sql: ${leads_omni.marketing_cost}
    label: Total Marketing Cost
    group_label: Total Costs
    format: usdcurrency
    description: Sum of total marketing related expenses.
    aggregate_type: sum

  total_intake_cost:
    sql: ${leads_omni.intake_cost}
    label: Total Intake Cost
    group_label: Total Costs
    format: usdcurrency
    description: Sum of total intake related expenses.
    aggregate_type: sum

  total_total_cost:
    sql: ${leads_omni.total_cost}
    label: Total Cost
    group_label: Total Costs
    format: usdcurrency
    description: Sum of total expenses.
    aggregate_type: sum

  ##############################
  # Total Revenue #
  ##############################

  total_total_revenue:
    sql: ${leads_omni.total_revenue}
    label: Total Revenue
    group_label: Total Revenue
    format: usdcurrency
    description: Sum of total revenue generated.
    aggregate_type: sum

  ##############################
  # Derived Metrics #
  ##############################

  total_total_profit:
    sql: COALESCE(${leads_omni.total_revenue}, 0) -
      COALESCE(${leads_omni.total_cost}, 0)
    label: Total Profit
    group_label: Derived Metrics
    format: usdcurrency
    description: (Total Revenue - Total Cost)
    aggregate_type: sum

  total_profit_margin:
    sql: (${leads_omni.total_total_revenue} - ${leads_omni.total_total_cost}) /
      NULLIF(${leads_omni.total_total_revenue}, 0)
    group_label: Derived Metrics
    format: percent_2
    description: (Total Revenue - Total Cost) / (Total Revenue)

  sum_delivered_and_signed_leads_count:
    sql: CASE WHEN ${leads_omni.is_delivered_lead_flag} = TRUE THEN 1 ELSE 0 END +
      CASE WHEN ${leads_omni.is_signed_lead_flag} = TRUE THEN 1 ELSE 0 END
    label: DLVD + SGND Leads
    group_label: Derived Metrics
    description: (Delivered Leads + Signed Leads)
    aggregate_type: sum

  sum_pending_returns_and_accepted_returns_count:
    sql: CASE WHEN ${leads_omni.is_pending_return_lead_flag} = TRUE THEN 1 ELSE 0
      END + CASE WHEN ${leads_omni.is_accepted_return_lead_flag} = TRUE THEN 1
      ELSE 0 END
    label: Total Returns
    group_label: Derived Metrics
    description: (Pending Returns + Accepted Returns)
    aggregate_type: sum

  diff_gross_signed_and_returned_leads:
    sql: ${leads_omni.gross_signed_leads_count} - ${leads_omni.returned_leads_count}
    label: Gross SGND - RTRND Leads
    group_label: Derived Metrics
    description: (Gross Signed - Returned Leads)

  delivered_and_signed_lead_conversion_rate:
    sql: ${leads_omni.sum_delivered_and_signed_leads_count} /
      NULLIF(${leads_omni.distributed_leads_count}, 0)
    label: CVR
    group_label: Derived Metrics
    format: percent_2
    description: (Delivered Leads + Signed Leads) / (Distributed Leads)

  total_marketing_cost_per_distributed_lead:
    sql: ${leads_omni.total_marketing_cost} /
      NULLIF(${leads_omni.distributed_leads_count}, 0)
    label: MKT Cost / DST Lead
    group_label: Derived Metrics
    format: usdcurrency
    description: (Total Marketing Cost) / (Distributed Leads)

  total_marketing_cost_per_delivered_and_signed_lead:
    sql: ${leads_omni.total_marketing_cost} /
      NULLIF(${leads_omni.sum_delivered_and_signed_leads_count}, 0)
    label: MKT Cost / DLVD + SGND Lead
    group_label: Derived Metrics
    format: usdcurrency
    description: (Total Marketing Cost) / (Delivered Leads + Signed Leads)

  total_marketing_cost_per_diff_gross_signed_and_returned_lead:
    sql: ${leads_omni.total_marketing_cost} /
      NULLIF(${leads_omni.diff_gross_signed_and_returned_leads}, 0)
    label: MKT Cost / Gross SGND - RTRND Lead
    group_label: Derived Metrics
    format: usdcurrency
    description: (Total Marketing Cost) / (Gross Signed - Returned Leads)

  total_cost_per_diff_gross_signed_and_returned_lead:
    sql: ${leads_omni.total_total_cost} /
      NULLIF(${leads_omni.diff_gross_signed_and_returned_leads}, 0)
    label: Total Cost / Gross SGND - RTRND Lead
    group_label: Derived Metrics
    format: usdcurrency
    description: (Total Cost) / (Gross Signed - Returned Leads)

  total_cost_per_delivered_and_signed_lead:
    sql: ${leads_omni.total_total_cost} /
      NULLIF(${leads_omni.sum_delivered_and_signed_leads_count}, 0)
    label: Total Cost / DLVD + SGND Lead
    group_label: Derived Metrics
    format: usdcurrency
    description: (Total Cost) / (Delivered Leads + Signed Leads)

  total_cost_per_distributed_lead:
    sql: ${leads_omni.total_total_cost} /
      NULLIF(${leads_omni.distributed_leads_count}, 0)
    label: Total Cost / DST Lead
    group_label: Derived Metrics
    format: usdcurrency
    description: (Total Cost) / (Distributed Leads)

  total_revenue_per_distributed_lead:
    sql: ${leads_omni.total_total_revenue} /
      NULLIF(${leads_omni.distributed_leads_count}, 0)
    label: Total Revenue / DST Lead
    group_label: Derived Metrics
    format: usdcurrency
    description: (Total Revenue) / (Distributed Leads)

  total_returns_per_gross_signed_leads:
    sql: ${leads_omni.sum_pending_returns_and_accepted_returns_count} /
      NULLIF(${leads_omni.gross_signed_leads_count}, 0)
    label: Total Return Rate
    group_label: Derived Metrics
    format: percent_2
    description: (Total Returns) / (Gross Signed Leads)

  total_gross_signed_leads_per_distributed_leads:
    sql: ${leads_omni.gross_signed_leads_count} /
      NULLIF(${leads_omni.distributed_leads_count}, 0)
    label: Gross Signed CVR of Distributed Leads
    group_label: Derived Metrics
    format: percent_2
    description: (Gross Signed Leads) / (Distributed Leads)

  total_delivered_leads_per_distributed_leads:
    sql: ${leads_omni.delivered_leads_count} /
      NULLIF(${leads_omni.distributed_leads_count}, 0)
    label: Billable CVR of Distributed Leads
    group_label: Derived Metrics
    format: percent_2
    description: (Billable Leads) / (Distributed Leads)

  ##############################
  # Derived Metrics - Anura #
  ##############################

  total_bad_anura_response_leads_per_distributed_leads:
    sql: ${leads_omni.bad_anura_response_leads_count} /
      NULLIF(${leads_omni.distributed_leads_count}, 0)
    label: Bad Anura Score %
    group_label: Derived Metrics - Anura
    format: percent_2
    description: (Bad Anura Response Leads) / (Distributed Leads)

  ##############################
  # Derived Metrics - Smart Reviews #
  ##############################

  smart_review_confirmed_dx_leads_percentage:
    sql: ${leads_omni.smart_review_confirmed_dx_leads_count} /
      NULLIF(${leads_omni.smart_review_eligible_leads_count}, 0)
    label: SR Confirmed DX %
    group_label: Derived Metrics - Smart Reviews
    format: percent_2
    description: (SR Confirmed DX Leads) / (Smart Review Eligible Leads)

  smart_review_potentially_viable_leads_percentage:
    sql: ${leads_omni.smart_review_potentially_viable_leads_count} /
      NULLIF(${leads_omni.smart_review_eligible_leads_count}, 0)
    label: SR Potentially Viable %
    group_label: Derived Metrics - Smart Reviews
    format: percent_2
    description: (SR Potentially Viable Leads) / (Smart Review Eligible Leads)

  smart_review_release_leads_percentage:
    sql: ${leads_omni.smart_review_release_leads_count} /
      NULLIF(${leads_omni.smart_review_eligible_leads_count}, 0)
    label: SR Release %
    group_label: Derived Metrics - Smart Reviews
    format: percent_2
    description: (SR Release Leads) / (Smart Review Eligible Leads)

  smart_review_keep_leads_percentage:
    sql: ${leads_omni.smart_review_keep_leads_count} /
      NULLIF(${leads_omni.smart_review_eligible_leads_count}, 0)
    label: SR Keep %
    group_label: Derived Metrics - Smart Reviews
    format: percent_2
    description: (SR Keep Leads) / (Smart Review Eligible Leads)

  smart_review_cnr_leads_percentage:
    sql: ${leads_omni.smart_review_cnr_leads_count} /
      NULLIF(${leads_omni.smart_review_eligible_leads_count}, 0)
    label: SR CNR %
    group_label: Derived Metrics - Smart Reviews
    format: percent_2
    description: (SR CNR Leads) / (Smart Review Eligible Leads)

  smart_review_empty_or_pending_leads_percentage:
    sql: ${leads_omni.smart_review_empty_or_pending_leads_count} /
      NULLIF(${leads_omni.smart_review_eligible_leads_count}, 0)
    label: SR Empty or Pending %
    group_label: Derived Metrics - Smart Reviews
    format: percent_2
    description: (SR Empty or Pending leads) / (Smart Review Eligible Leads)

  ##############################
  # Derived Metrics - Description #
  ##############################

  blank_description_leads_percentage:
    sql: ${leads_omni.blank_description_leads_count} /
      NULLIF(${leads_omni.distributed_leads_count}, 0)
    label: Blank Description %
    group_label: Derived Metrics - Description
    format: percent_2
    description: (Blank Description Leads) / (Distributed Leads)

  ##############################
  # Average Durations #
  ##############################

  avg_days_sold_to_signed:
    sql: ${days_sold_to_signed}
    label: AVG Days Sold to Signed
    group_label: Average Durations
    description: Average days between sold to signed.
    aggregate_type: average

  ##############################
  # Row-Level Drill #
  ##############################

  see_details:
    sql: ${lead_client_id}
    label: See Details
    group_label: Row-Level Drill
    description: Clickable drill field
    aggregate_type: count

filters:
  ##############################
  # Date Filters #
  ##############################

  date_type_selector:
    type: string
    group_label: Date Filters
    suggestion_list:
      - value: Lead
      - value: Sold
      - value: Signed
      - value: Delivered
      - value: Return Started

default_drill_fields:
  [
    lead_id,
    lead_client_id,
    created_at,
    sold_at,
    signed_at,
    last_status_updated_at,
    status,
    email_drop,
    anura_response,
    marketing_cost,
    intake_cost,
    total_cost,
    total_revenue,
    s1,
    s2,
    s3
  ]
