# Deploy: gcloud run services replace service.yaml --region us-central1 --project your-gcp-project
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: csv-loader
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: csv-loader@your-gcp-project.iam.gserviceaccount.com
      containerConcurrency: 4
      timeoutSeconds: 900
      containers:
        - image: us-central1-docker.pkg.dev/your-gcp-project/pipelines/csv-loader:latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: GCP_PROJECT
              value: your-gcp-project
            - name: RAW_DATASET
              value: sales_raw
