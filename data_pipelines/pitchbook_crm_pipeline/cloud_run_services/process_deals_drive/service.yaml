apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: process-deals-drive
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/build-function-target: sync_newest
    run.googleapis.com/build-base-image: us-central1-docker.pkg.dev/serverless-runtimes/google-22/runtimes/python311
    run.googleapis.com/build-enable-automatic-updates: "true"
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      labels:
        run.googleapis.com/startupProbeType: Default
      annotations:
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: your-service-account@your-project-id.iam.gserviceaccount.com
      containers:
      - name: process-deals-drive-1
        image: us-central1-docker.pkg.dev/your-project-id/cloud-run-source-deploy/process-deals-drive
        ports:
        - name: http1
          containerPort: 8080
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
        startupProbe:
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          tcpSocket:
            port: 8080
      runtimeClassName: run.googleapis.com/linux-base-image-update
  traffic:
  - percent: 100
    latestRevision: true
