apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: replicate-prod-tables-to-supabase-v2
  labels:
    cloud.googleapis.com/location: us-west1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/build-function-target: sync
    run.googleapis.com/build-base-image: us-west1-docker.pkg.dev/serverless-runtimes/google-22/runtimes/python312
    run.googleapis.com/build-enable-automatic-updates: "true"
    run.googleapis.com/minScale: 1
    run.googleapis.com/maxScale: 20
spec:
  template:
    metadata:
      labels:
        run.googleapis.com/startupProbeType: Default
      annotations:
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 3600
      serviceAccountName: your-service-account@your-project-id.iam.gserviceaccount.com
      containers:
      - name: replicate-prod-tables-to-supabase-v2-1
        image: us-west1-docker.pkg.dev/your-project-id/cloud-run-source-deploy/replicate-prod-tables-to-supabase-v2
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: SUPABASE_DB_PASSWORD
          value: your-supabase-db-password
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
        startupProbe:
          timeoutSeconds: 240
          periodSeconds: 240
          failureThreshold: 1
          tcpSocket:
            port: 8080
      runtimeClassName: run.googleapis.com/linux-base-image-update
  traffic:
  - percent: 100
    latestRevision: true
