# Cloud Run service definition.
# Deploy:  gcloud run services replace service.yaml --region us-central1 --project your-gcp-project
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: warehouse-to-postgres-sync
  labels:
    app: warehouse-to-postgres-sync
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"   # never run two syncs at once
    spec:
      serviceAccountName: pg-sync@your-gcp-project.iam.gserviceaccount.com
      containerConcurrency: 1
      timeoutSeconds: 3600
      containers:
        - image: us-central1-docker.pkg.dev/your-gcp-project/pipelines/warehouse-to-postgres-sync:latest
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: BQ_BILLING_PROJECT
              value: your-gcp-project
            - name: BATCH_SIZE
              value: "5000"
            - name: DRY_RUN
              value: "false"
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: pg-sync-dsn      # Secret Manager secret
                  key: latest
